---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: {{ print (include "bitcoin-core.fullname" .) "-entrypoint" | quote }}
  {{- with (merge .Values.global.labels .Values.configMap.labels (include "bitcoin-core.labels" . | fromYaml)) }}
  labels:
    {{- range $k, $v := . }}
    {{- $v = tpl $v $ }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
  {{- with (merge .Values.global.annotations .Values.configMap.annotations) }}
  annotations:
    {{- range $k, $v := . }}
    {{- $v = tpl $v $ }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
data:
  entrypoint: |
    #!/bin/ash
    echo "uid:gid for bitcoin:bitcoin is $(id -u bitcoin):$(id -g bitcoin)"
    set -ex
    exec su-exec bitcoin:bitcoin bitcoind -datadir="$BITCOIN_DATA"
